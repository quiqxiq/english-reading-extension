<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>English Immersion Reader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="brand-icon"><path d="M12 5v16"></path><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"></path></svg>
        <span class="brand-title">Immersion Reader</span>
      </div>
      <span class="version">v1.0</span>
    </div>

    <!-- Toggle Reading Mode -->
    <div class="toggle-card">
      <div class="toggle-info">
        <div class="toggle-title">Article Reading Mode</div>
        <div class="toggle-sub">Press <kbd>Alt + R</kbd> on page</div>
      </div>
      <button id="toggle-btn" class="toggle-btn">Enable</button>
    </div>

    <!-- Anki Connection Status -->
    <div class="anki-card">
      <div class="anki-status-row">
        <span class="anki-label">AnkiConnect Status:</span>
        <div class="status-indicator">
          <span id="anki-dot" class="dot red"></span>
          <span id="anki-text" class="status-text">Checking...</span>
        </div>
      </div>
      <div id="anki-deck-info" class="anki-deck-sub">Deck: English Immersion</div>
    </div>

    <!-- Vocabulary Stats -->
    <div class="stats-grid">
      <div class="stat-box known">
        <div class="stat-num" id="stat-known">0</div>
        <div class="stat-label">Known</div>
      </div>
      <div class="stat-box learning">
        <div class="stat-num" id="stat-learning">0</div>
        <div class="stat-label">Learn</div>
      </div>
    </div>

    <!-- Footer Actions -->
    <div class="footer-actions">
      <button id="options-btn" class="secondary-btn"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>Settings & Custom AI Prompts</button>
    </div>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
